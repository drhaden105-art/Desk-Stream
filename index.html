<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Desk Stream</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #080b12;
    color: #fff;
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

/* NAVIGATION */

.topbar {
    height: 70px;
    background: #10151f;
    border-bottom: 1px solid #252d3a;
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 25px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    background: none;
    border: 0;
    color: white;
    font-size: 20px;
    font-weight: bold;
    white-space: nowrap;
}

.brand-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: white;
    color: #10151f;
    display: grid;
    place-items: center;
    font-weight: 900;
}

.nav {
    display: flex;
    gap: 4px;
    flex: 1;
}

.nav button {
    border: 0;
    background: transparent;
    color: #aeb8c8;
    padding: 10px 13px;
    border-radius: 8px;
}

.nav button:hover,
.nav button.active {
    background: #1b2230;
    color: white;
}

.top-actions {
    display: flex;
    gap: 8px;
}

.search-button,
.secondary {
    background: #151c27;
    color: white;
    border: 1px solid #303948;
    padding: 10px 15px;
    border-radius: 8px;
}

.primary {
    background: white;
    color: #080b12;
    border: 0;
    padding: 11px 17px;
    border-radius: 8px;
    font-weight: bold;
}

/* MAIN */

main {
    width: min(1250px, 100%);
    margin: auto;
    padding: 35px 24px 70px;
}

.hero {
    padding: 30px 0 45px;
}

.eyebrow {
    color: #75aaff;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 12px;
}

.hero h1 {
    font-size: clamp(40px, 6vw, 68px);
    margin: 0 0 20px;
    line-height: 1;
}

.hero p {
    color: #9da8b8;
    max-width: 750px;
    line-height: 1.6;
    font-size: 17px;
}

.hero-actions {
    display: flex;
    gap: 10px;
    margin-top: 25px;
    flex-wrap: wrap;
}

/* SECTIONS */

.section {
    margin-top: 30px;
}

.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
}

.section-header h2 {
    margin: 0;
}

/* CARDS */

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 15px;
}

.card {
    background: #111823;
    border: 1px solid #252e3b;
    border-radius: 14px;
    padding: 20px;
}

.card:hover {
    border-color: #3c485a;
}

.card h3 {
    margin: 12px 0 8px;
}

.card p {
    color: #98a4b4;
    line-height: 1.5;
}

.badge {
    display: inline-block;
    background: #202938;
    color: #dce4ef;
    border-radius: 30px;
    padding: 5px 9px;
    font-size: 11px;
    font-weight: bold;
}

.live-badge {
    background: #3a1c22;
    color: #ff9ca8;
}

/* FORMS */

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.field.full {
    grid-column: 1 / -1;
}

.field label {
    color: #cbd4df;
    font-size: 13px;
    font-weight: bold;
}

.field input,
.field select,
.field textarea {
    width: 100%;
    background: #0c1119;
    color: white;
    border: 1px solid #303948;
    border-radius: 8px;
    padding: 12px;
    outline: none;
}

.field textarea {
    min-height: 110px;
    resize: vertical;
}

/* STREAM PREVIEW */

.preview {
    aspect-ratio: 16 / 9;
    background: #020306;
    border: 1px solid #252e3b;
    border-radius: 14px;
    display: grid;
    place-items: center;
    color: #697587;
    margin-bottom: 20px;
}

.preview.live {
    border-color: #6b2730;
}

.preview-content {
    text-align: center;
}

.preview-content strong {
    display: block;
    font-size: 22px;
    color: white;
    margin-bottom: 7px;
}

/* STATUS */

.status {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #111823;
    border: 1px solid #252e3b;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 15px;
}

.status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #687587;
}

.status-dot.live {
    background: #ff5967;
}

/* TABLE */

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #111823;
    border: 1px solid #252e3b;
    border-radius: 12px;
    overflow: hidden;
}

th,
td {
    text-align: left;
    padding: 14px;
    border-bottom: 1px solid #252e3b;
}

th {
    color: #aeb8c8;
    font-size: 13px;
}

/* PROJECTION */

.projection {
    background: #000;
    min-height: 500px;
    border-radius: 14px;
    border: 1px solid #303030;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 40px;
}

.projection small {
    color: #888;
}

.projection h2 {
    font-size: clamp(30px, 5vw, 65px);
}

/* FOOTER */

footer {
    border-top: 1px solid #252d3a;
    padding: 25px;
    color: #7f8b9c;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
}

/* MOBILE */

@media (max-width: 850px) {

    .nav {
        display: none;
    }

    .topbar {
        padding: 0 15px;
    }

    .top-actions {
        margin-left: auto;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .field.full {
        grid-column: auto;
    }
}

@media (max-width: 500px) {

    .search-button {
        display: none;
    }

    main {
        padding: 25px 15px 50px;
    }
}
</style>

/* ==========================
   START STREAM
========================== */

function startStream() {

    const title =
        document.getElementById("streamTitle").value
        || "Untitled Stream";

    const preview =
        document.getElementById("streamPreview");

    const dot =
        document.getElementById("statusDot");

    const status =
        document.getElementById("statusText");

    preview.classList.add("live");

    preview.innerHTML = `

        <div class="preview-content">

            <strong>
                ● LIVE
            </strong>

            ${escapeHTML(title)}

        </div>

    `;

    dot.classList.add("live");

    status.textContent =
        "Live preview active";

}


/* ==========================
   STOP STREAM
========================== */

function stopStream() {

    const preview =
        document.getElementById("streamPreview");

    const dot =
        document.getElementById("statusDot");

    const status =
        document.getElementById("statusText");

    if (!preview) {
        return;
    }

    preview.classList.remove("live");

    preview.innerHTML = `

        <div class="preview-content">

            <strong>
                Stream Preview
            </strong>

            Camera and stream preview
            will appear here.

        </div>

    `;

    dot.classList.remove("live");

    status.textContent =
        "Ready to stream";

}

        document.getElementById("searchInput");

    const results =
        document.getElementById("searchResults");

    const query =
        input.value.trim();

    if (!query) {

        results.innerHTML = `

            <div class="card">

                Please enter a search term.

            </div>

        `;

        return;

    }

    results.innerHTML = `

        <div class="card">

            <span class="badge">
                SEARCH RESULT
            </span>

            <h3>
                ${escapeHTML(query)}
            </h3>

            <p>
                Search backend will be connected
                in the next stage.
            </p>

        </div>

    `;

}


/* ==========================
   WATCH
========================== */

function watch() {

    app.innerHTML = `

        <section class="hero">

            <div class="eyebrow">
                LIVE PLAYER
            </div>

            <h1>
                Joy Church
            </h1>

            <p>
                Live broadcast preview.
            </p>

        </section>


        <div class="preview">

            <div class="preview-content">

                <strong>
                    Live Player
                </strong>

                Video will appear here when
                the streaming backend is connected.

            </div>

        </div>


        <button
            class="secondary"
            onclick="live()"
        >
            Back to Live
        </button>

    `;

}


/* ==========================
   CLOCK
========================== */

function updateClock() {

    const clock =
        document.getElementById("clock");

    if (!clock) {
        return;
    }

    const now = new Date();

    clock.textContent =
        now.toLocaleTimeString();

    setTimeout(updateClock, 1000);

}


/* ==========================
   SECURITY
========================== */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ==========================
   START
========================== */

home();
