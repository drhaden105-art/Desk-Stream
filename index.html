<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Desk Stream</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #080b12;
    color: #fff;
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

/* NAVIGATION */

.topbar {
    height: 70px;
    background: #10151f;
    border-bottom: 1px solid #252d3a;
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 25px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    background: none;
    border: 0;
    color: white;
    font-size: 20px;
    font-weight: bold;
    white-space: nowrap;
}

.brand-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: white;
    color: #10151f;
    display: grid;
    place-items: center;
    font-weight: 900;
}

.nav {
    display: flex;
    gap: 4px;
    flex: 1;
}

.nav button {
    border: 0;
    background: transparent;
    color: #aeb8c8;
    padding: 10px 13px;
    border-radius: 8px;
}

.nav button:hover,
.nav button.active {
    background: #1b2230;
    color: white;
}

.top-actions {
    display: flex;
    gap: 8px;
}

.search-button,
.secondary {
    background: #151c27;
    color: white;
    border: 1px solid #303948;
    padding: 10px 15px;
    border-radius: 8px;
}

.primary {
    background: white;
    color: #080b12;
    border: 0;
    padding: 11px 17px;
    border-radius: 8px;
    font-weight: bold;
}

/* MAIN */

main {
    width: min(1250px, 100%);
    margin: auto;
    padding: 35px 24px 70px;
}

.hero {
    padding: 30px 0 45px;
}

.eyebrow {
    color: #75aaff;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 12px;
}

.hero h1 {
    font-size: clamp(40px, 6vw, 68px);
    margin: 0 0 20px;
    line-height: 1;
}

.hero p {
    color: #9da8b8;
    max-width: 750px;
    line-height: 1.6;
    font-size: 17px;
}

.hero-actions {
    display: flex;
    gap: 10px;
    margin-top: 25px;
    flex-wrap: wrap;
}

/* SECTIONS */

.section {
    margin-top: 30px;
}

.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
}

.section-header h2 {
    margin: 0;
}

/* CARDS */

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 15px;
}

.card {
    background: #111823;
    border: 1px solid #252e3b;
    border-radius: 14px;
    padding: 20px;
}

.card:hover {
    border-color: #3c485a;
}

.card h3 {
    margin: 12px 0 8px;
}

.card p {
    color: #98a4b4;
    line-height: 1.5;
}

.badge {
    display: inline-block;
    background: #202938;
    color: #dce4ef;
    border-radius: 30px;
    padding: 5px 9px;
    font-size: 11px;
    font-weight: bold;
}

.live-badge {
    background: #3a1c22;
    color: #ff9ca8;
}

/* FORMS */

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.field.full {
    grid-column: 1 / -1;
}

.field label {
    color: #cbd4df;
    font-size: 13px;
    font-weight: bold;
}

.field input,
.field select,
.field textarea {
    width: 100%;
    background: #0c1119;
    color: white;
    border: 1px solid #303948;
    border-radius: 8px;
    padding: 12px;
    outline: none;
}

.field textarea {
    min-height: 110px;
    resize: vertical;
}

/* STREAM PREVIEW */

.preview {
    aspect-ratio: 16 / 9;
    background: #020306;
    border: 1px solid #252e3b;
    border-radius: 14px;
    display: grid;
    place-items: center;
    color: #697587;
    margin-bottom: 20px;
}

.preview.live {
    border-color: #6b2730;
}

.preview-content {
    text-align: center;
}

.preview-content strong {
    display: block;
    font-size: 22px;
    color: white;
    margin-bottom: 7px;
}

/* STATUS */

.status {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #111823;
    border: 1px solid #252e3b;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 15px;
}

.status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #687587;
}

.status-dot.live {
    background: #ff5967;
}

/* TABLE */

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #111823;
    border: 1px solid #252e3b;
    border-radius: 12px;
    overflow: hidden;
}

th,
td {
    text-align: left;
    padding: 14px;
    border-bottom: 1px solid #252e3b;
}

th {
    color: #aeb8c8;
    font-size: 13px;
}

/* PROJECTION */

.projection {
    background: #000;
    min-height: 500px;
    border-radius: 14px;
    border: 1px solid #303030;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 40px;
}

.projection small {
    color: #888;
}

.projection h2 {
    font-size: clamp(30px, 5vw, 65px);
}

/* FOOTER */

footer {
    border-top: 1px solid #252d3a;
    padding: 25px;
    color: #7f8b9c;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
}

/* MOBILE */

@media (max-width: 850px) {

    .nav {
        display: none;
    }

    .topbar {
        padding: 0 15px;
    }

    .top-actions {
        margin-left: auto;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .field.full {
        grid-column: auto;
    }
}

@media (max-width: 500px) {

    .search-button {
        display: none;
    }

    main {
        padding: 25px 15px 50px;
    }
}
</style>
</head>

function activate(id) {

    document
        .querySelectorAll(".nav button")
        .forEach(button => {
            button.classList.remove("active");

    const button = document.getElementById(id);

    if (button) {
        button.classList.add("active");
    }
}

function startStream() {

    const title =
        document.getElementById("streamTitle").value.trim()
        || "Untitled Stream";

    const preview =
        document.getElementById("streamPreview");

    const dot =
        document.getElementById("statusDot");

    const status =
        document.getElementById("statusText");

    preview.classList.add("live");

    preview.innerHTML = `
        <div class="preview-content">
            <strong>● LIVE</strong>
            <br><br>
            ${escapeHTML(title)}
        </div>
    `;

    dot.classList.add("live");
    status.textContent = "Live preview active";

    const streamData = {
        title: title,
        description: localStorage.getItem("deskStreamDescription") || "",
        category: document.getElementById("category").value,
        startedAt: new Date().toISOString()
    };

    localStorage.setItem(
        "deskStreamActive",
        JSON.stringify(streamData)
    );
}


function stopStream() {

    const preview =
        document.getElementById("streamPreview");

    const dot =
        document.getElementById("statusDot");

    const status =
        document.getElementById("statusText");

    if (!preview) return;

    const activeStream =
        localStorage.getItem("deskStreamActive");

    if (activeStream) {

        const stream =
            JSON.parse(activeStream);

        stream.endedAt =
            new Date().toISOString();

        const history =
            JSON.parse(
                localStorage.getItem("deskStreamPast") || "[]"
            );

        history.unshift(stream);

        localStorage.setItem(
            "deskStreamPast",
            JSON.stringify(history)
        );

        localStorage.removeItem("deskStreamActive");
    }

    preview.classList.remove("live");

    preview.innerHTML = `
        <div class="preview-content">
            <strong>Stream Preview</strong>
            Camera and stream preview will appear here.
        </div>
    `;

    dot.classList.remove("live");
    status.textContent = "Ready to stream";
}


let deskCameraEnabled = true;
let deskMicEnabled = true;
let deskRecording = false;
let deskVirtualCamera = false;

let deskScenes =
    JSON.parse(localStorage.getItem("deskStreamScenes") || "[]");

let deskChannels =
    JSON.parse(localStorage.getItem("deskStreamChannels") || "[]");


function openStreamDescription() {
    document.getElementById("streamDescriptionModal").classList.add("show");
}


function closeStreamDescription() {
    document.getElementById("streamDescriptionModal").classList.remove("show");
}


function saveStreamDescription() {
    const description =
        document.getElementById("streamDescription").value;

    localStorage.setItem(
        "deskStreamDescription",
        description

    closeStreamDescription();
}


function toggleDeskCamera() {

    deskCameraEnabled = !deskCameraEnabled;

    const button =
        document.getElementById("cameraToggle");

    button.textContent =
        deskCameraEnabled ? "ON" : "OFF";

    button.classList.toggle(
        "on",
        deskCameraEnabled
    );
}


function toggleDeskMic() {

    deskMicEnabled = !deskMicEnabled;

    const button =
        document.getElementById("micToggle");

    button.textContent =
        deskMicEnabled ? "ON" : "OFF";

    button.classList.toggle(
        "on",
        deskMicEnabled
    );
}


function openDeskMultiView() {

}


function openSceneCreator() {

    document.getElementById("newSceneName").value = "";

    document.getElementById(
        "sceneCreatorModal"
    ).classList.add("show");
}


function closeSceneCreator() {

    document.getElementById(
        "sceneCreatorModal"
    ).classList.remove("show");
}


function createDeskScene() {

    const name =
        document.getElementById(
            "newSceneName"
        ).value.trim();

    if (!name) {
        alert("Please enter a scene name.");
        return;
    }

    deskScenes.push({
        id: Date.now(),
        name: name
    });

    localStorage.setItem(
        "deskStreamScenes",
        JSON.stringify(deskScenes)
    );

    closeSceneCreator();
    renderDeskScenes();
}


function renderDeskScenes() {

    const list =
        document.getElementById("sceneList");

    if (!list) return;

    if (!deskScenes.length) {

        list.innerHTML = `
            <div class="ds-empty">
                No scenes yet.<br>
                Click <strong>+ Add Scene</strong> to create your own.
            </div>
        `;

        return;
    }

    list.innerHTML =
        deskScenes.map(
            (scene, index) => `
                <div
                    class="ds-list-item ds-scene-item ${index === 0 ? "active" : ""}"
                    onclick="selectDeskScene(${scene.id}, this)"
                >
                    <div class="ds-scene-left">
                        <div class="ds-scene-thumb">SCENE</div>

                        <div class="ds-item-info">
                            <strong>${escapeHTML(scene.name)}</strong>
                            <span>User created scene</span>
                        </div>
                    </div>

                    <div class="ds-item-actions">
                        <button
                            onclick="event.stopPropagation(); deleteDeskScene(${scene.id})"
                        >
                            🗑
                        </button>
                    </div>
                </div>
            `
        ).join("");
}


function selectDeskScene(id, element) {

    document
        .querySelectorAll(".ds-scene-item")
        .forEach(item =>
            item.classList.remove("active")
        );

    element.classList.add("active");
}


function deleteDeskScene(id) {

    const scene =
        deskScenes.find(item => item.id === id);

    if (!scene) return;

    if (!confirm(`Delete scene "${scene.name}"?`)) {
        return;
    }

    deskScenes =
        deskScenes.filter(item => item.id !== id);

    localStorage.setItem(
        "deskStreamScenes",
        JSON.stringify(deskScenes)
    );

    renderDeskScenes();
}


function openChannelCreator() {

    if (deskChannels.length >= 50) {
        alert("You have reached the 50-channel limit.");
        return;
    }

    document.getElementById("newChannelName").value = "";
    document.getElementById("newChannelKey").value = "";

    document.getElementById(
        "channelCreatorModal"
    ).classList.add("show");
}


function closeChannelCreator() {

    document.getElementById(
        "channelCreatorModal"
    ).classList.remove("show");
}


function createDeskChannel() {

    if (deskChannels.length >= 50) {
        alert("You have reached the 50-channel limit.");
        return;
    }

    const name =
        document.getElementById(
            "newChannelName"
        ).value.trim();

    const platform =
        document.getElementById(
            "newChannelPlatform"
        ).value;

    const key =
        document.getElementById(
            "newChannelKey"
        ).value.trim();

    if (!name) {
        alert("Please enter the channel account name.");
        return;
    }

    if (!key) {
        alert("Please enter the stream key.");
        return;
    }

    deskChannels.push({
        id: Date.now(),
        name: name,
        platform: platform,
        connected: false,
        hasKey: true
    });

    localStorage.setItem(
        "deskStreamChannels",
        JSON.stringify(deskChannels)
    );

    closeChannelCreator();
    renderDeskChannels();
}


function renderDeskChannels() {

    const list =
        document.getElementById("channelList");

    const count =
        document.getElementById("channelCount");

    if (!list) return;

    if (count) {
        count.textContent =
            deskChannels.length + " / 50";
    }

    if (!deskChannels.length) {

        list.innerHTML = `
            <div class="ds-empty">
                No channel accounts yet.<br>
                Click <strong>+ Add Channel</strong>.
            </div>
        `;

        return;
    }

    list.innerHTML =
        deskChannels.map(
            channel => `
                <div class="ds-list-item">

                    <div class="ds-item-info">
                        <strong>${escapeHTML(channel.name)}</strong>
                        <span>
                            ${escapeHTML(channel.platform)}
                            •
                            ${channel.connected ? "Connected" : "Not Connected"}
                        </span>
                    </div>

                    <div class="ds-item-actions">

                        <button onclick="toggleDeskChannel(${channel.id})">
                            ${channel.connected ? "Disconnect" : "Connect"}
                        </button>

                        <button onclick="deleteDeskChannel(${channel.id})">
                            🗑
                        </button>

                    </div>

                </div>
            `
        ).join("");
}


function toggleDeskChannel(id) {

    const channel =
        deskChannels.find(item => item.id === id);

    if (!channel) return;

    channel.connected =
        !channel.connected;

    localStorage.setItem(
        "deskStreamChannels",
        JSON.stringify(deskChannels)
    );

    renderDeskChannels();
}


function deleteDeskChannel(id) {

    const channel =
        deskChannels.find(item => item.id === id);

    if (!channel) return;

    if (!confirm(`Remove channel "${channel.name}"?`)) {
        return;
    }

    deskChannels =
        deskChannels.filter(item => item.id !== id);

    localStorage.setItem(
        "deskStreamChannels",
        JSON.stringify(deskChannels)
    );

    renderDeskChannels();
}


function toggleDeskRecording() {

    deskRecording = !deskRecording;

function updateClock() {

    const clock =
        document.getElementById("clock");

    if (!clock) {
        return;
    }

    const now = new Date();

    clock.textContent =
        now.toLocaleTimeString();

    setTimeout(updateClock, 1000);

}


/* ==========================
   SECURITY
========================== */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}
