<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Desk Stream</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080b12;
      color: #ffffff;
      min-height: 100vh;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar {
      height: 70px;
      background: #10151f;
      border-bottom: 1px solid #252d3a;

      display: flex;
      align-items: center;

      padding: 0 24px;
      gap: 28px;

      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      background: transparent;
      border: none;
      color: white;

      font-size: 20px;
      font-weight: 700;

      white-space: nowrap;
    }

    .brand-icon {
      width: 38px;
      height: 38px;

      background: #ffffff;
      color: #10151f;

      border-radius: 10px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-weight: 800;
      font-size: 20px;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 4px;

      flex: 1;
    }

    .nav button {
      background: transparent;
      border: none;

      color: #aeb8c8;

      padding: 10px 13px;
      border-radius: 8px;

      font-size: 14px;
    }

    .nav button:hover,
    .nav button.active {
      background: #1b2230;
      color: white;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .search-button {
      background: #171e29;
      border: 1px solid #303948;

      color: #dbe2ec;

      padding: 10px 14px;
      border-radius: 8px;
    }

    .live-button {
      background: white;
      color: #080b12;

      border: none;

      padding: 10px 16px;
      border-radius: 8px;

      font-weight: 700;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      width: min(1200px, 100%);
      margin: auto;
      padding: 40px 24px 70px;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      padding: 35px 0 55px;
    }

    .eyebrow {
      color: #75aaff;

      font-size: 13px;
      font-weight: 700;

      letter-spacing: 2px;

      margin-bottom: 15px;
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 72px);
      line-height: 1;

      max-width: 850px;

      margin-bottom: 22px;
    }

    .hero p {
      max-width: 720px;

      color: #9da8b8;

      font-size: 17px;
      line-height: 1.65;
    }

    .hero-actions {
      display: flex;
      gap: 12px;

      margin-top: 28px;

      flex-wrap: wrap;
    }

    .primary-button {
      background: white;
      color: #080b12;

      border: none;

      padding: 12px 18px;

      border-radius: 8px;

      font-weight: 700;
    }

    .secondary-button {
      background: #151c27;

      color: white;

      border: 1px solid #303948;

      padding: 12px 18px;

      border-radius: 8px;
    }

    /* =========================
       SECTIONS
    ========================= */

    .section {
      margin-top: 35px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 16px;
    }

    .section-header h2 {
      font-size: 24px;
    }

    .section-header button {
      background: transparent;
      border: none;

      color: #75aaff;

      font-weight: 600;
    }

    /* =========================
       CARDS
    ========================= */

    .cards {
      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

      gap: 16px;
    }

    .card {
      background: #111823;

      border: 1px solid #252e3b;

      border-radius: 14px;

      padding: 20px;

      min-height: 170px;

      transition: transform 0.15s ease,
                  border-color 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: #3c485a;
    }

    .card h3 {
      font-size: 19px;
      margin: 14px 0 8px;
    }

    .card p {
      color: #99a5b5;

      line-height: 1.5;

      margin-bottom: 16px;
    }

    .badge {
      display: inline-block;

      background: #202938;

      color: #d9e1ec;

      border-radius: 30px;

      padding: 5px 9px;

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 0.5px;
    }

    .live-badge {
      background: #3a1c22;
      color: #ff9ca8;
    }

    /* =========================
       PLAYER
    ========================= */

    .player {
      width: 100%;

      aspect-ratio: 16 / 9;

      background: #020306;

      border: 1px solid #252e3b;

      border-radius: 15px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #6f7c8e;

      margin-bottom: 20px;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-box {
      display: flex;
      gap: 10px;

      margin-bottom: 30px;
    }

    .search-box input {
      flex: 1;

      background: #111823;

      color: white;

      border: 1px solid #303948;

      padding: 13px;

      border-radius: 8px;

      outline: none;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      border-top: 1px solid #252d3a;

      padding: 25px;

      color: #7f8b9c;

      display: flex;
      justify-content: space-between;

      gap: 20px;

      flex-wrap: wrap;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 850px) {
      .topbar {
        padding: 0 15px;
      }

      .nav {
        display: none;
      }

      .top-actions {
        margin-left: auto;
      }
    }

    @media (max-width: 550px) {
      .search-button {
        display: none;
      }

      main {
        padding: 25px 15px 50px;
      }

      .hero {
        padding-top: 20px;
      }

      footer {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       TOP NAVIGATION
  ========================= -->

  <header class="topbar">

    <button class="brand" onclick="showHome()">

      <span class="brand-icon">D</span>

      <span>Desk Stream</span>

    </button>


    <nav class="nav">

      <button id="nav-home" onclick="showHome()">
        Home
      </button>

      <button id="nav-live" onclick="showLive()">
        Live
      </button>

      <button id="nav-channels" onclick="showChannels()">
        Channels
      </button>

      <button id="nav-bible" onclick="showBible()">
        Bible
      </button>

      <button id="nav-videos" onclick="showVideos()">
        Videos
      </button>

    </nav>


    <div class="top-actions">

      <button
        class="search-button"
        onclick="showSearch()"
      >
        Search
      </button>

      <button
        class="live-button"
        onclick="showStudio()"
      >
        Go Live
      </button>

    </div>

  </header>


  <!-- =========================
       APPLICATION
  ========================= -->

  <main id="app"></main>


  <!-- =========================
       FOOTER
  ========================= -->

  <footer>

    <span>
      © 2026 Desk Stream
    </span>

    <span>
      Free streaming and presentation platform
    </span>

  </footer>


  <!-- =========================
       APPLICATION JAVASCRIPT
  ========================= -->

  <script>

    /* -------------------------
       NAVIGATION
    ------------------------- */

    function clearActiveNav() {

      document
        .querySelectorAll(".nav button")
        .forEach(button => {
          button.classList.remove("active");
        });

    }


    function activateNav(id) {

      clearActiveNav();

      const button =
        document.getElementById(id);

      if (button) {
        button.classList.add("active");
      }

    }


    /* -------------------------
       HOME
    ------------------------- */

    function showHome() {

      activateNav("nav-home");

      document.getElementById("app").innerHTML = `

        <section class="hero">

          <div class="eyebrow">
            DESK STREAM
          </div>

          <h1>
            Stream, present, watch and share.
          </h1>

          <p>
            Desk Stream is a free streaming platform
            designed for churches, creators,
            communities, events and everyone who
            wants to share live video.
          </p>

          <div class="hero-actions">

            <button
              class="primary-button"
              onclick="showStudio()"
            >
              Start Streaming
            </button>

            <button
              class="secondary-button"
              onclick="showBible()"
            >
              Bible Projection
            </button>

          </div>

        </section>


        <section class="section">

          <div class="section-header">

            <h2>
              Live Now
            </h2>

            <button onclick="showLive()">
              View All
            </button>

          </div>


          <div class="cards">

            <div class="card">

              <span class="badge live-badge">
                ● LIVE
              </span>

              <h3>
                Joy Church
              </h3>

              <p>
                Church broadcast • 128 viewers
              </p>

              <button
                class="primary-button"
                onclick="watchLive()"
              >
                Watch
              </button>

            </div>


            <div class="card">

              <span class="badge">
                FEATURED
              </span>

              <h3>
                Desk Stream
              </h3>

              <p>
                Official Desk Stream channel
              </p>

            </div>


            <div class="card">

              <span class="badge">
                CHURCH
              </span>

              <h3>
                Church Services
              </h3>

              <p>
                Discover live church broadcasts.
              </p>

            </div>

          </div>

        </section>


        <section class="section">

          <div class="section-header">

            <h2>
              Features
            </h2>

          </div>


          <div class="cards">

            <div class="card">

              <span class="badge">
                LIVE
              </span>

              <h3>
                Live Streaming
              </h3>

              <p>
                Broadcast events and services
                to viewers online.
              </p>

            </div>


            <div class="card">

              <span class="badge">
                PRESENT
              </span>

              <h3>
                Bible Projection
              </h3>

              <p>
                Prepare Bible verses and
                presentation content.
              </p>

            </div>


            <div class="card">

              <span class="badge">
                CHANNELS
              </span>

              <h3>
                Channels
              </h3>

              <p>
                Create and discover Desk Stream
                channels.
              </p>

            </div>


            <div class="card">

              <span class="badge">
                QUALITY
              </span>

              <h3>
                High Quality
              </h3>

              <p>
                Designed for modern
                high-resolution streaming.
              </p>

            </div>

          </div>

        </section>

      `;

    }


    /* -------------------------
       LIVE
    ------------------------- */

    function showLive() {

      activateNav("nav-live");

      document.getElementById("app").innerHTML = `

        <section class="hero">

          <div class="eyebrow">
            LIVE
          </div>

          <h1>
            Live broadcasts
          </h1>

          <p>
            Watch live broadcasts from
            Desk Stream channels.
          </p>

        </section>


        <section class="section">

          <div class="cards">

            <div class="card">

              <span class="badge live-badge">
                ● LIVE
              </span>

              <h3>
                Joy Church
              </h3>

              <p>
                Church service • 128 viewers
              </p>

              <button
                class="primary-button"
                onclick="watchLive()"
              >
                Watch Live
              </button>

            </div>


            <div class="card">

              <span class="badge live-badge">
                ● LIVE
              </span>

              <h3>
                Desk Stream Events
              </h3>

              <p>
                Live events and broadcasts.
              </p>

              <button
                class="primary-button"
                onclick="watchLive()"
              >
                Watch
              </button>

            </div>

          </div>

        </section>

      `;

    }


    /* -------------------------
       CHANNELS
    ------------------------- */

    function showChannels() {

      activateNav("nav-channels");

      document.getElementById("app").innerHTML = `

        <section class="hero">

          <div class="eyebrow">
            CHANNELS
          </div>

          <h1>
            Discover channels
          </h1>

          <p>
            Find streams and content from
            the Desk Stream community.
          </p>

        </section>


        <section class="section">

          <div class="cards">

            <div class="card">

              <span class="badge">
                CHURCHES
              </span>

              <h3>
                Joy Church
              </h3>

              <p>
                Live church broadcasts
                and services.
              </p>

            </div>


            <div class="card">

              <span class="badge">
                GAMING
              </span>

              <h3>
                Gaming
              </h3>

              <p>
                Gaming livestreams
                and events.
              </p>

            </div>


            <div class="card">

              <span class="badge">
                MUSIC
              </span>

              <h3>
                Music
              </h3>

              <p>
                Music broadcasts
                and performances.
              </p>

            </div>


            <div class="card">

              <span class="badge">
                EVENTS
              </span>

              <h3>
                Events
              </h3>

              <p>
                Conferences, meetings
                and special events.
              </p>

            </div>

          </div>

        </section>

      `;

    }


    /* -------------------------
       BIBLE
    ------------------------- */

    function showBible() {

      activateNav("nav-bible");

      document.getElementById("app").innerHTML = `

        <section class="hero">

          <div class="eyebrow">
            BIBLE PROJECTION
          </div>

          <h1>
            Bible Presentation
          </h1>

          <p>
            Prepare scripture for your
            presentation and projection.
          </p>

        </section>


        <section class="section">

          <div class="cards">

            <div class="card">

              <span class="badge">
                SCRIPTURE
              </span>

              <h3>
                Bible Search
              </h3>

              <p>
                Search for a Bible book,
                chapter and verse.
              </p>

              <button
                class="primary-button"
                onclick="openProjection()"
              >
                Open Projection
              </button>

            </div>


            <div class="card">

              <span class="badge">
                DISPLAY
              </span>

              <h3>
                Audience Display
              </h3>

              <p>
                A clean presentation screen
                for your audience.
              </p>

            </div>


            <div class="card">

              <span class="badge">
                STAGE
              </span>

              <h3>
                Stage Display
              </h3>

              <p>
                Prepare upcoming verses
                and presentation notes.
              </p>

            </div>

          </div>

        </section>

      `;

    }


    /* -------------------------
       PROJECTION
    ------------------------- */

    function openProjection() {

      document.getElementById("app").innerHTML = `

        <section class="hero">

          <div class="eyebrow">
            PROJECTION
          </div>

          <h1>
            Bible Projection
          </h1>

          <p>
            Projection preview.
          </p>

        </section>


        <div class="player">

          Bible Projection Preview

        </div>


        <button
          class="primary-button"
          onclick="showBible()"
        >
          Back to Bible

        </button>

      `;

    }


    /* -------------------------
       VIDEOS
    ------------------------- */

    function showVideos() {

      activateNav("nav-videos");

      document.getElementById("app").innerHTML = `

        <section class="hero">

          <div class="eyebrow">
            VIDEOS
          </div>

          <h1>
            Video Library
          </h1>

          <p>
            Your recorded videos and
            broadcasts will appear here.
          </p>

        </section>


        <section class="section">

          <div class="cards">

            <div class="card">

              <span class="badge">
                VIDEO
              </span>

              <h3>
                Your Videos
              </h3>

              <p>
                Upload and organize recordings
                in a future version.
              </p>

            </div>


            <div class="card">

              <span class="badge">
                RECORDINGS
              </span>

              <h3>
                Live Recordings
              </h3>

              <p>
                Saved broadcasts will appear here.
              </p>

            </div>

          </div>

        </section>

      `;

    }


    /* -------------------------
       CREATOR STUDIO
    ------------------------- */

    function showStudio() {

      clearActiveNav();

      document.getElementById("app").innerHTML = `

        <section class="hero">

          <div class="eyebrow">
            CREATOR STUDIO
          </div>

          <h1>
            Go Live
          </h1>

          <p>
            Configure your Desk Stream
            broadcast.
          </p>

        </section>


        <section class="section">

          <div class="cards">

            <div class="card">

              <span class="badge">
                STREAM
              </span>

              <h3>
                Create Broadcast
              </h3>

              <p>
                Set up a new Desk Stream broadcast.
              </p>

              <button
                class="primary-button"
                onclick="createStream()"
              >
                Create Stream
              </button>

            </div>


            <div class="card">

              <span class="badge">
                DESTINATIONS
              </span>

              <h3>
                Streaming Platforms
              </h3>

              <p>
                YouTube • TikTok • Facebook
                • Twitch • Custom RTMP
              </p>

            </div>


            <div class="card">

              <span class="badge">
                QUALITY
              </span>

              <h3>
                Video Quality
              </h3>

              <p>
                1080p • 1440p • 4K
              </p>

            </div>

          </div>

        </section>

      `;

    }


    /* -------------------------
       CREATE STREAM
    ------------------------- */

    function createStream() {

      alert(
        "Desk Stream streaming setup will be connected in the next version."
      );

    }


    /* -------------------------
       WATCH
    ------------------------- */

    function watchLive() {

      document.getElementById("app").innerHTML = `

        <section class="hero">

          <div class="eyebrow">
            LIVE PLAYER
          </div>

          <h1>
            Joy Church
          </h1>

          <p>
            Live broadcast preview.
          </p>

        </section>


        <div class="player">

          Live video player

        </div>


        <button
          class="primary-button"
          onclick="showLive()"
        >
          Back to Live

        </button>

      `;

    }


    /* -------------------------
       SEARCH
    ------------------------- */

    function showSearch() {

      clearActiveNav();

      document.getElementById("app").innerHTML = `

        <section class="hero">

          <div class="eyebrow">
            SEARCH
          </div>

          <h1>
            Search Desk Stream
          </h1>

          <p>
            Find channels, broadcasts,
            videos and Bible content.
          </p>

        </section>


        <div class="search-box">

          <input
            id="searchInput"
            type="text"
            placeholder="Search Desk Stream..."
          >

          <button
            class="primary-button"
            onclick="performSearch()"
          >
            Search
          </button>

        </div>


        <div id="searchResults"></div>

      `;

    }


    function performSearch() {

      const input =
        document.getElementById("searchInput");

      const results =
        document.getElementById("searchResults");

      const query =
        input.value.trim();

      if (!query) {

        results.innerHTML = `

          <div class="card">

            Please enter something to search.

          </div>

        `;

        return;

      }

      results.innerHTML = `

        <div class="card">

          <span class="badge">
            SEARCH
          </span>

          <h3>
            Search Results
          </h3>

          <p>
            Searching for:
            <strong>${escapeHTML(query)}</strong>
          </p>

          <p>
            Full Desk Stream search will be
            connected in a future version.
          </p>

        </div>

      `;

    }


    /* -------------------------
       SECURITY HELPER
    ------------------------- */

    function escapeHTML(text) {

      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* -------------------------
       START APPLICATION
    ------------------------- */

    showHome();

  </script>

</body>
</html>
